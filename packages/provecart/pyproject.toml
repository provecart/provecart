[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "provecart"
version = "0.1.0"
description = "ProveCart client: check an AI agent's cart, booking, or reservation against the buyer's signed instructions before payment is captured."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["ai-agents", "agent-commerce", "verification", "payments", "provecart"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://provecart.com"
Documentation = "https://provecart.com/agents"
"Correction format" = "https://provecart.com/standards/correction-format"

[tool.setuptools.packages.find]
where = ["src"]
